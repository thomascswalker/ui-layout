    .button { fill: #d0e6ff; stroke: #2b6cb0; stroke-width: 1px; }
    .label { font-family: Arial, sans-serif; font-size: 12px; fill: #000; }</style>
    <!-- Root Window -->
    <!-- Standalone Text -->
    <!-- Frame -->
    <!-- Text inside Frame -->
    <!-- Dropdown -->
    <!-- Button -->
