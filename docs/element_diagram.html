<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>title</title>
</head>

<body>
    <div align="center">
        <svg width="400" height="340" viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg">
            <rect x="30" y="30" width="340" height="280" fill="#7dbbe6" />
            <text x="200" y="22" font-size="14" text-anchor="middle" fill="#000">margin-top</text>
            <text x="200" y="330" font-size="14" text-anchor="middle" fill="#000">margin-bottom</text>
            <text x="10" y="170" font-size="14" text-anchor="middle" fill="#000"
                transform="rotate(-90 10,170)">margin-left</text>
            <text x="390" y="170" font-size="14" text-anchor="middle" fill="#000"
                transform="rotate(-90 390,170)">margin-right</text>
            <rect x="60" y="60" width="280" height="220" fill="#fff8ee" />
            <text x="200" y="52" font-size="13" text-anchor="middle" fill="#000">border-top</text>
            <text x="200" y="312" font-size="13" text-anchor="middle" fill="#000">border-bottom</text>
            <text x="50" y="170" font-size="13" text-anchor="middle" fill="#000"
                transform="rotate(-90 50,170)">border-left</text>
            <text x="350" y="170" font-size="13" text-anchor="middle" fill="#000"
                transform="rotate(-90 350,170)">border-right</text>
            <rect x="90" y="90" width="220" height="160" fill="#ff9c6e" />
            <text x="200" y="82" font-size="12" text-anchor="middle" fill="#a33">padding-top</text>
            <text x="200" y="262" font-size="12" text-anchor="middle" fill="#a33">padding-bottom</text>
            <text x="80" y="170" font-size="12" text-anchor="middle" fill="#a33"
                transform="rotate(-90 80,170)">padding-left</text>
            <text x="320" y="170" font-size="12" text-anchor="middle" fill="#a33"
                transform="rotate(-90 320,170)">padding-right</text>
            <rect x="130" y="120" width="140" height="100" fill="#6d0000" />
            <text x="200" y="170" font-size="15" text-anchor="middle" fill="#fff">content</text>
            <line x1="140" y1="210" x2="260" y2="210" stroke="#fff" stroke-width="2" marker-start="url(#arrow)"
                marker-end="url(#arrow)" />
            <text x="200" y="225" font-size="13" text-anchor="middle" fill="#fff">width</text>
            <line x1="260" y1="130" x2="260" y2="210" stroke="#fff" stroke-width="2" marker-start="url(#arrow)"
                marker-end="url(#arrow)" />
            <text x="275" y="170" font-size="13" text-anchor="middle" fill="#fff"
                transform="rotate(-90 275,170)">height</text>
            <g stroke="#222" stroke-width="2" marker-end="url(#arrow)" font-size="13" fill="#222">
                <line x1="200" y1="10" x2="200" y2="30" />
                <text x="192" y="18" font-size="13">top</text>
                <line x1="390" y1="170" x2="370" y2="170" />
                <text x="375" y="162" font-size="13">right</text>
                <line x1="200" y1="330" x2="200" y2="310" />
                <text x="192" y="325" font-size="13">bottom</text>
                <line x1="10" y1="170" x2="30" y2="170" />
                <text x="25" y="162" font-size="13">left</text>
            </g>
            <defs>
                <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"
                    markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#222" />
                </marker>
            </defs>
        </svg>
    </div>
</body>

</html>
